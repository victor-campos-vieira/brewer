<!doctype html>
<html lang="pt-BR" style="background-color:#1A130E">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brewer</title>
<meta name="theme-color" content="#1A130E">
<style>
  html, body {
    background-color: #1A130E;
    color: #F7F2E8;
    margin: 0;
  }
</style>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brewer">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=43">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=43">
<script>
  try {
    var sp0 = new URLSearchParams(window.location.search || '');
    var raw = localStorage.getItem('brewer.v1');
    var s = raw ? JSON.parse(raw) : null;
    var f = s && s.focus;
    var hasFocus = f && (f.mode === 'focus' || f.mode === 'break' || f.mode === 'pomo-ready');
    if (!hasFocus && !sp0.get('tab')) {
      document.documentElement.classList.add('gate-lock');
    }
  } catch(e) {}
</script>
</head>
<body data-theme="0" data-tab="hoje" data-mood="entardecer">
<!-- Camada Atmosférica Viva em 100vw x 100dvh -->
<div id="livingBackdrop" class="living-backdrop" aria-hidden="true">
  <div class="lb-sky"></div>
  <div class="lb-sunbeams"></div>
  <div class="lb-orb lb-orb-1"></div>
  <div class="lb-orb lb-orb-2"></div>
  <div class="lb-grain"></div>
  <canvas id="livingCanvas" class="lb-canvas"></canvas>
</div>
<div class="env" aria-hidden="true"></div>

<main id="scroll"><div class="wrap">
  <section id="tab-hoje" class="tab" hidden></section>
  <section id="tab-agenda" class="tab" hidden></section>
  <section id="tab-tarefas" class="tab" hidden></section>
  <section id="tab-foco" class="tab" hidden></section>
  <section id="tab-vontade" class="tab" hidden></section>
  <section id="tab-revisao" class="tab" hidden></section>
  <section id="tab-colecao" class="tab" hidden></section>
  <section id="tab-jornada" class="tab" hidden></section>
</div></main>

<div class="runpill" id="runpill"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<nav class="bar floating-dock-v2" aria-label="Navegação Principal">
  <div class="bar-in">
    <button data-act="tab" data-tab="hoje">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M5.3 18.7l1.5-1.5M17.2 6.8l1.5-1.5"/></svg>
      <span>Hoje</span>
    </button>
    <button data-act="tab" data-tab="agenda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3.5"/><path d="M9 4.5v16M3.5 9.5h17"/></svg>
      <span>Agenda</span>
    </button>
    <button class="urge dock-urge-v2" data-act="tab" data-tab="vontade" aria-label="Bateu a vontade — Pausa consciente">
      <span class="duv-orb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12c2.5-4 5.5-4 8 0s5.5 4 8 0 3.5-2 4-1"/><path d="M2 17c2.5-3.5 5.5-3.5 8 0s5.5 3.5 8 0"/></svg>
      </span>
      <span>Pausa</span>
    </button>
    <button data-act="tab" data-tab="tarefas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="6" height="6" rx="1.8"/><path d="M13 7.5h7.5"/><rect x="3.5" y="13.5" width="6" height="6" rx="1.8"/><path d="M13 16.5h7.5"/></svg>
      <span>Tarefas</span>
    </button>
    <button data-act="tab" data-tab="revisao">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2.2"/></svg>
      <span>Resumo</span>
    </button>
  </div>
</nav>

<div class="back" id="sheetBack" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="assets/cafe/v2/catalog.js"></script>
<script type="module" src="js/boot.js?v=43"></script>
<script>
if (window.location.protocol === 'file:') {
  window.addEventListener('DOMContentLoaded', function() {
    var main = document.querySelector('.wrap');
    if (main) {
      main.innerHTML = '<div style="background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:26px 20px;text-align:center;margin-top:30px;box-shadow:0 8px 24px rgba(42,29,20,.08)">' +
        '<h2 style="font-family:\'Bricolage Grotesque\',Figtree,sans-serif;font-size:22px;margin-bottom:10px;color:var(--ink)">Quase lá!</h2>' +
        '<p style="color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:16px">O navegador bloqueia módulos JavaScript (ES Modules) por segurança quando abertos diretamente pelo caminho <code>file:///</code>.</p>' +
        '<p style="font-size:14.5px;line-height:1.5;margin-bottom:20px;color:var(--ink)">Para rodar o app no computador, basta dar duplo clique no arquivo <b><code>iniciar-servidor.bat</code></b> na pasta do Brewer!</p>' +
      '</div>';
    }
  });
}
</script>
<script>
// Brewer PWA: instala o Service Worker em produção HTTPS; em localhost mantém sem cache para testes rápidos.
if ('serviceWorker' in navigator) {
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      for (var reg of regs) reg.unregister();
    });
  } else {
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      window.location.reload();
    });
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').then(function(reg){
        reg.update();
      }).catch(function(err){ console.warn('Brewer SW:', err); });
    });
  }
}
</script>
</body>
</html>
