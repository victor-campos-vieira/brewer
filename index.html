<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brewer</title>
<meta name="theme-color" content="#F6EFE4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brewer">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=38">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png?v=38">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=38">
</head>
<body data-theme="0">
<div class="env"></div>
<main id="scroll"><div class="wrap">
  <section id="tab-hoje" class="tab"></section>
  <section id="tab-agenda" class="tab" hidden></section>
  <section id="tab-tarefas" class="tab" hidden></section>
  <section id="tab-foco" class="tab" hidden></section>
  <section id="tab-vontade" class="tab" hidden></section>
  <section id="tab-revisao" class="tab" hidden></section>
  <section id="tab-colecao" class="tab" hidden></section>
  <section id="tab-jornada" class="tab" hidden></section>
</div></main>

<div class="runpill" id="runpill"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<nav class="bar" aria-label="Navegação">
  <div class="bar-in">
    <button data-act="tab" data-tab="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>Hoje</button>
    <button data-act="tab" data-tab="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Agenda</button>
    <button class="urge" data-act="tab" data-tab="vontade">Bateu a vontade</button>
    <button data-act="tab" data-tab="tarefas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7l2 2 3.5-3.5M4.5 16l2 2 3.5-3.5M13 8h7M13 17h7"/></svg>Tarefas</button>
    <button data-act="tab" data-tab="revisao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 20v-6M12 20V6M18 20v-10"/></svg>Revisão</button>
  </div>
</nav>

<div class="back" id="sheetBack" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="assets/cafe/v2/catalog.js"></script>
<script type="module" src="js/app.js"></script>
<script>
// Alerta amigável caso o index.html seja aberto direto com duplo clique (protocolo file:///)
if (window.location.protocol === 'file:') {
  window.addEventListener('DOMContentLoaded', function() {
    var main = document.querySelector('.wrap');
    if (main) {
      main.innerHTML = '<div style="background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:26px 20px;text-align:center;margin-top:30px;box-shadow:0 8px 24px rgba(42,29,20,.08)">' +
        '<div style="font-size:32px;margin-bottom:8px">☕</div>' +
        '<h2 style="font-family:\'Bricolage Grotesque\',Figtree,sans-serif;font-size:22px;margin-bottom:10px;color:var(--ink)">Quase lá!</h2>' +
        '<p style="color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:16px">O Google Chrome bloqueia módulos JavaScript (ES Modules) por segurança quando abertos diretamente pelo caminho <code>file:///</code>.</p>' +
        '<p style="font-size:14.5px;line-height:1.5;margin-bottom:20px;color:var(--ink)">Para rodar o app no computador, basta dar duplo clique no arquivo <b><code>iniciar-servidor.bat</code></b> na pasta do Brewer!</p>' +
        '<div style="font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:12px;padding:12px;border:1px solid var(--line);text-align:left;line-height:1.5">' +
          '<b>Outras opções fáceis:</b><br>' +
          '• No VS Code: clique com o botão direito em <code>index.html</code> e escolha <b>Open with Live Server</b>.<br>' +
          '• No terminal (PowerShell): rode <code>npx serve .</code>' +
        '</div>' +
      '</div>';
    }
  });
}
</script>
<script>
// Brewer PWA: instala o Service Worker quando o app estiver servido por HTTPS.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    window.location.reload();
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.update();
    }).catch(function(err){ console.warn('Brewer SW:', err); });
  });
}
</script>
</body>
</html>
